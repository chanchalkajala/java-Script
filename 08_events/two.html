<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Async js</title>
</head>

<body>
  <h1>chai aur code</h1>
  <button id="stop">Stope</button>
</body>

<script>
  // ye 2 second ke bad mera name ko console pe print ho rha hai

  // },2000)

  // heading change ho rha hai 2 second ke bad page pr 
  // const sayPallu = function () {

  // }
  // const changeHeading = function () {
  //     document.querySelector('h1')
  //     .innerHTML = "best js langauge"
  // }

  // heading ko change jo rha hai button pr click krne ab change nhi hoga
  const changeHeading = function () {
    document.querySelector('h1').innerHTML = "best js language";
  };

  const changeMe = setTimeout(changeHeading, 2000);

  document.querySelector('#stop').addEventListener('click', function () {
    clearTimeout(changeMe);
    console.log("stopped");
  });
</script>

</html>
